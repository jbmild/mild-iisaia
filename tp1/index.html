<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hola mundo — TP 1</title>
  <style>
    :root {
      --color-bg: #f4f1ea;
      --color-surface: #fffdf8;
      --color-text: #1c1917;
      --color-muted: #57534e;
      --color-accent: #0f766e;
      --color-border: #d6d3d1;
      --space-sm: 0.75rem;
      --space-md: 1.5rem;
      --space-lg: 3rem;
      --font-body: Georgia, "Times New Roman", serif;
      --font-ui: system-ui, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: var(--font-body);
      font-size: 1.125rem;
      line-height: 1.6;
      color: var(--color-text);
      background: var(--color-bg);
    }

    header,
    main,
    footer {
      width: min(40rem, calc(100% - var(--space-lg)));
      margin-inline: auto;
    }

    header {
      padding-block: var(--space-lg) var(--space-md);
    }

    header p {
      margin: 0 0 var(--space-sm);
      font-family: var(--font-ui);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-accent);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 6vw, 3.75rem);
      line-height: 1.1;
      font-weight: 700;
    }

    main {
      flex: 1;
    }

    section {
      padding: var(--space-md);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 8px;
    }

    section p {
      margin: 0;
      color: var(--color-muted);
    }

    footer {
      padding-block: var(--space-md) var(--space-lg);
      font-family: var(--font-ui);
      font-size: 0.875rem;
      color: var(--color-muted);
    }

    footer p {
      margin: 0;
    }
  </style>
</head>
<body>
  <header>
    <p>Introducción a la ingeniería de software asistida por IA</p>
    <h1>Hola mundo</h1>
  </header>

  <main>
    <section>
      <p>
        Esta es una página de saludo hecha solo con HTML y CSS,
        usando etiquetas que describen cada parte del documento.
      </p>
    </section>
  </main>

  <footer>
    <p>Jonatan Mild — TP 1</p>
  </footer>
</body>
</html>
